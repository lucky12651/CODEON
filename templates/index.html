<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CODEON — Online Compiler</title>
    <link rel="icon" href="{{ url_for('static', filename='img/mark.jpg') }}" type="image/jpeg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@360;400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
</head>
<body>
    <div class="atmosphere" aria-hidden="true">
        <div class="mesh mesh-a"></div>
        <div class="mesh mesh-b"></div>
        <div class="mesh mesh-c"></div>
        <div class="grid-overlay"></div>
    </div>

    <div class="app">
        <header class="topbar">
            <a class="brand" href="/" aria-label="CODEON home">
                <img class="mark" src="{{ url_for('static', filename='img/mark.jpg') }}" alt="">
                <div class="brand-copy">
                    <span class="wordmark" aria-hidden="true">
                        <span class="wm-c">C</span><span class="wm-o">O</span><span class="wm-d">D</span>
                        <span class="wm-e"><i></i><i></i><i></i></span>
                        <span class="wm-o2">O</span>
                        <span class="wm-n">N</span>
                    </span>
                    <span class="sr-only">CODEON</span>
                    <span class="tagline">online compiler</span>
                </div>
            </a>

            <div class="file-chip" title="Active file">
                <span class="file-dot"></span>
                <span id="file-name">main.py</span>
            </div>

            <div class="top-actions">
                <button type="button" class="icon-btn" id="theme-toggle" aria-label="Toggle theme" title="Toggle theme">
                    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <circle cx="12" cy="12" r="4.2" stroke="currentColor" stroke-width="1.7"/>
                        <path d="M12 3v1.8M12 19.2V21M4.9 4.9l1.3 1.3M17.8 17.8l1.3 1.3M3 12h1.8M19.2 12H21M4.9 19.1l1.3-1.3M17.8 6.2l1.3-1.3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
                    </svg>
                    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <path d="M16.2 13.2A6.4 6.4 0 0 1 11 5.1 7 7 0 1 0 18.9 13a6.3 6.3 0 0 1-2.7.2z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
                    </svg>
                </button>
                <button type="button" class="run-btn" id="run-btn" title="Run code">
                    <span class="run-glow" aria-hidden="true"></span>
                    <svg class="run-play" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                        <path d="M8.4 5.6v12.8a1 1 0 0 0 1.52.85l10-6.4a1 1 0 0 0 0-1.7l-10-6.4A1 1 0 0 0 8.4 5.6z"/>
                    </svg>
                    <svg class="run-spin" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="2.2" opacity=".25"/>
                        <path d="M20 12a8 8 0 0 0-8-8" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
                    </svg>
                    <span class="run-label">Run</span>
                </button>
            </div>
        </header>

        <aside class="rail" aria-label="Languages">
            <p class="rail-kicker">Workspace</p>
            <h2 class="rail-title">Languages</h2>

            <div class="lang-list" role="tablist" aria-label="Select language">
                <button type="button" class="lang-card is-active" data-lang="python" role="tab" aria-selected="true">
                    <span class="lang-badge" data-lang="python">Py</span>
                    <span class="lang-meta">
                        <strong>Python</strong>
                        <small>main.py</small>
                    </span>
                </button>
                <button type="button" class="lang-card" data-lang="java" role="tab" aria-selected="false">
                    <span class="lang-badge" data-lang="java">Ja</span>
                    <span class="lang-meta">
                        <strong>Java</strong>
                        <small>Main.java</small>
                    </span>
                </button>
                <button type="button" class="lang-card" data-lang="cpp" role="tab" aria-selected="false">
                    <span class="lang-badge" data-lang="cpp">C++</span>
                    <span class="lang-meta">
                        <strong>C++</strong>
                        <small>main.cpp</small>
                    </span>
                </button>
                <button type="button" class="lang-card" data-lang="c" role="tab" aria-selected="false">
                    <span class="lang-badge" data-lang="c">C</span>
                    <span class="lang-meta">
                        <strong>C</strong>
                        <small>main.c</small>
                    </span>
                </button>
            </div>

            <div class="rail-foot">
                <p>Write, compile, and run in the browser. Output lands in the console on the right.</p>
            </div>
        </aside>

        <main class="workspace">
            <section class="editor-pane" aria-label="Code editor">
                <div class="pane-bar">
                    <div class="pane-title">
                        <span class="pane-lights" aria-hidden="true"><i></i><i></i><i></i></span>
                        <span>Editor</span>
                    </div>
                    <div class="pane-actions">
                        <input type="file" id="file-input" accept=".py,.java,.cpp,.cc,.cxx,.c,.txt" hidden>
                        <button type="button" class="ghost-btn" id="btn-import" title="Import file">
                            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3v12m0 0 4-4m-4 4-4-4M5 19h14" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
                            Import
                        </button>
                        <button type="button" class="ghost-btn" id="btn-copy" title="Copy code">
                            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="8" y="8" width="11" height="13" rx="2" stroke="currentColor" stroke-width="1.7"/><path d="M5 16V5.8A1.8 1.8 0 0 1 6.8 4H15" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
                            Copy
                        </button>
                        <button type="button" class="ghost-btn" id="btn-save" title="Save file">
                            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 5h11l3 3v11H5V5z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M8 5v5h8V5M8 19v-6h8v6" stroke="currentColor" stroke-width="1.7"/></svg>
                            Save
                        </button>
                    </div>
                </div>
                <div id="editor"></div>
            </section>

            <div class="gutter" id="gutter" role="separator" aria-orientation="vertical" aria-label="Resize panels"></div>

            <section class="io-pane" aria-label="Input and output">
                <div class="io-block stdin-block">
                    <div class="pane-bar compact">
                        <div class="pane-title">
                            <span class="pulse-dot" aria-hidden="true"></span>
                            Program input
                        </div>
                        <span class="pane-hint">stdin</span>
                    </div>
                    <textarea id="stdin" placeholder="Optional program input (stdin)" spellcheck="false"></textarea>
                </div>

                <div class="io-block console-block">
                    <div class="pane-bar compact">
                        <div class="pane-title">
                            <span class="term-chevron" aria-hidden="true">❯</span>
                            Console
                        </div>
                        <button type="button" class="ghost-btn tiny" id="btn-clear" title="Clear console">
                            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 7h14M10 7V5h4v2m-7 0 1 12h8l1-12" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
                            Clear
                        </button>
                    </div>
                    <pre id="output" class="output is-empty">Ready when you are.
Hit Run or press Ctrl+Enter.</pre>
                </div>
            </section>
        </main>

        <footer class="statusbar">
            <span class="stat" id="status-lang">Python</span>
            <span class="sep"></span>
            <span class="stat" id="status-cursor">Ln 1, Col 1</span>
            <span class="sep"></span>
            <span class="stat" id="status-state">Ready</span>
            <span class="status-spacer"></span>
            <span class="stat muted" id="status-hint">Ctrl + Enter to run</span>
        </footer>
    </div>

    <div id="toasts" class="toasts" aria-live="polite" aria-atomic="true"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.36.5/ace.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.36.5/ext-language_tools.min.js"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
